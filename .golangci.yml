version: "2"

linters:
  enable:
    - errorlint
    - gosec
    - misspell
    - unconvert
  settings:
    gosec:
      excludes:
        # Running gh with the user's arguments is the purpose of this tool.
        - G204
        # The lock path is built from os.UserCacheDir and a sanitized host name.
        - G304
  exclusions:
    rules:
      # Not real credentials (G101) and not secret files (G306): tests use fake tokens and an executable fake gh.
      - path: _test\.go
        linters: [gosec]
        text: G101|G306

formatters:
  enable:
    - gofmt
